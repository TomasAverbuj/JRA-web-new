<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizar — JRA Web Design LLC</title>
  <meta name="description" content="Solicita presupuesto a JRA Web Design. Web, diseño, fotografía y más en Puerto Rico.">
  <link rel="icon" href="assets/img/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="cotizar">
  <div id="site-header"></div>
  <main id="contenido">
    <section class="page-hero">
      <div class="hero-waves" data-gradient-waves aria-hidden="true"></div>
      <div class="container">
        <p class="eyebrow">Presupuesto</p>
        <h1>Solicitud de presupuesto.</h1>
        <p>Completa estos datos y te preparamos una propuesta. También puedes escribirnos por WhatsApp al (787) 320-2552.</p>
        <p style="margin-top:10px;font-size:0.9rem;color:var(--muted)">Más adelante este formulario se conectará a Elementor / Fluent Forms en WordPress.</p>
      </div>
    </section>
    <section>
      <div class="container" style="max-width:760px">
        <form class="info-card" data-jra-form>
          <div class="form-grid">
            <div class="form-row">
              <label>Nombre del negocio<input name="negocio" required></label>
              <label>Email<input type="email" name="email" required></label>
            </div>
            <div class="form-row">
              <label>Nombre del propietario<input name="propietario" required></label>
              <label>Teléfono<input type="tel" name="telefono" required></label>
            </div>
            <label>Industria<input name="industria" required placeholder="Ej. restaurante, bienes raíces, salud..."></label>
            <label>Presupuesto actual para el proyecto
              <select name="presupuesto" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="$300">$300</option>
                <option value="$500">$500</option>
                <option value="$700">$700</option>
                <option value="$1000">$1000</option>
                <option value="$1200 +">$1200 +</option>
              </select>
            </label>
            <label>¿Qué necesidad tiene actualmente en su negocio?<textarea name="necesidad" required rows="4" placeholder="Cuéntanos qué quieres lograr..."></textarea></label>
            <label>¿Interesa una cita presencial?
              <select name="cita" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="Oficina de JRA (Hormigueros)">Oficina de JRA (Hormigueros)</option>
                <option value="Mi local o pueblo">Mi local o pueblo</option>
              </select>
            </label>
            <label>Comentarios<textarea name="comentarios" rows="4" placeholder="Algo más que debamos saber..."></textarea></label>
            <button class="btn btn-primary" type="submit">Enviar solicitud</button>
            <div class="form-success" role="status"></div>
          </div>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/includes.js"></script>
  <script src="assets/js/gradient-waves.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
